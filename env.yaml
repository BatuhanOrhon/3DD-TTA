# Reproducible Linux x86_64 / Python 3.8 environment for 3DD-TTA Colab.
# The successful extension build log reports CUDA 12.8 with PyTorch cu121.
# GCC/G++ 12.2 are selected as a compatible host toolchain; their exact
# version was not recorded in the supplied build log.
name: 3dd_tta_env
channels:
  - conda-forge
  - https://conda.anaconda.org/nvidia/label/cuda-12.8.0
channel_priority: strict
dependencies:
  - python=3.8.20
  - pip=24.3.1
  - setuptools=75.3.0
  - wheel=0.45.1
  - numpy=1.24.4
  - scipy=1.9.1
  - matplotlib=3.7.3
  - h5py=3.11.0
  - scikit-image=0.20.0
  - cmake=4.4.4
  - libusb=1.0.26
  - gcc_linux-64=12.2.0
  - gxx_linux-64=12.2.0
  - cuda-toolkit=12.8.0
  - pip:
      - -r requirements.txt
